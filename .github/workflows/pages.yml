name: Validate and deploy salon to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.site_mode.outputs.production }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect production site
        id: site_mode
        shell: bash
        run: |
          if node -e "const v=require('./tests/validate-site-data.cjs');process.exit(v.loadSiteData('site-data.js').mode==='production'?0:1)"; then
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "Template mode: Pages deployment is intentionally skipped."
          fi

      - name: Resolve frozen TANEM baseline
        if: steps.site_mode.outputs.production == 'true'
        run: |
          if ! git cat-file -e '79ea1c63864627b634528c6c6f39c997226f85c4^{commit}' 2>/dev/null; then
            git fetch --no-tags --depth=1 https://github.com/ichAEY/Shablon-only-for-salons.git refs/heads/baseline/services-approved-v1-2026-09-28
          fi
          git cat-file -e '79ea1c63864627b634528c6c6f39c997226f85c4^{commit}'

      - name: Validate production contract
        if: steps.site_mode.outputs.production == 'true'
        run: |
          node tests/validate-site-data.cjs --production
          node tests/check-factory-contract.cjs
          node tests/check-template-regression.cjs

      - name: Build safe Pages artifact
        if: steps.site_mode.outputs.production == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          core_files=(
            index.html
            desktop.css
            desktop.js
            mobile.css
            mobile-overrides.css
            mobile.js
            salon-palette.css
            site-data.js
            site-regions.js
            site-runtime.js
            favicon-source.png
            logo-placeholder.svg
            media-placeholder.svg
          )

          for file in "${core_files[@]}"; do
            test -f "$file"
            cp "$file" _site/
          done

          shopt -s nullglob
          for file in hero.webp profile.webp gallery-*.webp team-*.webp logo.webp logo.png logo.svg; do
            if [[ -f "$file" ]]; then
              cp "$file" _site/
            fi
          done

          touch _site/.nojekyll

          test ! -e _site/intake
          test ! -e _site/tests
          test ! -e _site/docs
          test ! -e _site/.github

      - name: Configure GitHub Pages
        if: steps.site_mode.outputs.production == 'true'
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.TANEM_PAGES_TOKEN || github.token }}
          enablement: ${{ secrets.TANEM_PAGES_TOKEN != '' && 'true' || 'false' }}

      - name: Upload Pages artifact
        if: steps.site_mode.outputs.production == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: needs.validate-and-package.outputs.production == 'true'
    needs: validate-and-package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
